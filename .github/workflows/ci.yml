name: CI

on:
  push:
    branches: [ main ]
  # Every PR gets checks, whatever its base: a stacked PR (based on another PR's branch) would
  # otherwise report no checks at all, which reads as passing.
  pull_request:

# A newer push to the same PR (or branch) cancels its superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check
      if: matrix.os == 'ubuntu-latest'

    - name: Run tests
      run: cargo test --all-features

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      if: matrix.os == 'ubuntu-latest'

  compiler-detection:
    name: Compiler Detection
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Install Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.13.0

    - name: Install Nim (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y nim

    - name: Install Nim (macOS)
      if: runner.os == 'macOS'
      run: brew install nim

    - name: Install D compiler (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ldc

    - name: Install D compiler (macOS)
      if: runner.os == 'macOS'
      run: brew install ldc

    - name: Install Odin
      uses: laytan/setup-odin@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        release: latest

    - name: Install V
      uses: vlang/setup-v@v1.7
      with:
        stable: true

    - name: Run tests with multiple compilers
      run: cargo test --all-features
      env:
        # Fail, rather than skip and report `ok`, if an installed-above compiler is missing.
        EQ_REQUIRE_COMPILERS: zig,nim,d,odin,v

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Build docs
      run: cargo doc --all-features --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
