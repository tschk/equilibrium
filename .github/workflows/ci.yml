name: CI

on:
  push:
    branches: [ main ]
  # Every PR gets checks, whatever its base: a stacked PR (based on another PR's branch) would
  # otherwise report no checks at all, which reads as passing.
  pull_request:

# A newer push to the same PR (or branch) cancels its superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check
      if: matrix.os == 'ubuntu-latest'

    - name: Run tests
      run: cargo test --all-features

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      if: matrix.os == 'ubuntu-latest'

  compiler-detection:
    name: Compiler Detection
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Install Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.13.0

    - name: Install Nim (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y nim

    - name: Install Nim (macOS)
      if: runner.os == 'macOS'
      run: brew install nim

    - name: Install D compiler (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ldc

    - name: Install D compiler (macOS)
      if: runner.os == 'macOS'
      run: brew install ldc

    - name: Install Odin
      uses: laytan/setup-odin@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        release: latest

    # The prebuilt release, not vlang/setup-v: that action builds V from source, and its `make`
    # step failed on both runners.
    - name: Install V
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset=v_linux.zip ;;
          macOS-ARM64) asset=v_macos_arm64.zip ;;
          macOS-X64) asset=v_macos_x86_64.zip ;;
          *) echo "no prebuilt V for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        curl -fsSL -o "$RUNNER_TEMP/v.zip" "https://github.com/vlang/v/releases/download/0.5.2/$asset"
        unzip -q "$RUNNER_TEMP/v.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/v/v" version

    # Hare has no apt package on ubuntu-latest and does not run on macOS, so its toolchain is
    # built from pinned release tags and cached; the source build only reruns when a tag changes.
    - name: Cache Hare toolchain
      if: runner.os == 'Linux'
      id: hare-cache
      uses: actions/cache@v4
      with:
        path: ~/hare-toolchain
        key: hare-${{ runner.os }}-${{ runner.arch }}-qbe-v1.3-harec-0.26.0-hare-0.26.0.1

    - name: Build Hare toolchain
      if: runner.os == 'Linux' && steps.hare-cache.outputs.cache-hit != 'true'
      run: |
        set -eux
        sudo apt-get install -y scdoc   # hare's install target builds the man pages
        prefix="$HOME/hare-toolchain"
        src="$RUNNER_TEMP/hare-src"
        mkdir -p "$src"
        git clone --depth 1 --branch v1.3 git://c9x.me/qbe.git "$src/qbe"
        make -C "$src/qbe" -j2 PREFIX="$prefix" install
        export PATH="$prefix/bin:$PATH"
        git clone --depth 1 --branch 0.26.0 https://git.sr.ht/~sircmpwn/harec "$src/harec"
        cp "$src/harec/configs/linux.mk" "$src/harec/config.mk"
        make -C "$src/harec" -j2 PREFIX="$prefix"
        make -C "$src/harec" PREFIX="$prefix" install
        git clone --depth 1 --branch 0.26.0.1 https://git.sr.ht/~sircmpwn/hare "$src/hare"
        cp "$src/hare/configs/linux.mk" "$src/hare/config.mk"
        make -C "$src/hare" -j2 PREFIX="$prefix"
        make -C "$src/hare" PREFIX="$prefix" install

    - name: Add Hare to PATH
      if: runner.os == 'Linux'
      run: |
        echo "$HOME/hare-toolchain/bin" >> "$GITHUB_PATH"
        "$HOME/hare-toolchain/bin/hare" version

    - name: Run tests with multiple compilers
      run: cargo test --all-features
      env:
        # Fail, rather than skip and report `ok`, if an installed-above compiler is missing.
        # Hare is Linux-only, so it is required only there.
        EQ_REQUIRE_COMPILERS: zig,nim,d,odin,v${{ runner.os == 'Linux' && ',hare' || '' }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Build docs
      run: cargo doc --all-features --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
