[package]
name = "equilibrium-ffi"
authors = ["Max Carter <max@undivisible.dev>"]
version = "0.3.1"
edition = "2021"
description = "Compile and link C-ABI code from Zig, C, C++, D, Nim, Odin, Hare, Rust and TypeScript (scriptc), and generate Rust bindings from C headers (unstable and in development)"
license = "ISC"
repository = "https://github.com/tschk/equilibrium"
exclude = ["AGENTS.md", ".agents", ".amp"]

[dependencies]
which = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"], optional = true }
dialoguer = { version = "0.11", optional = true }
console = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "eq"
path = "src/bin/eq/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap", "dep:dialoguer", "dep:console"]
